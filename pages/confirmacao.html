<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmação - Amakha Paris</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/confirmacao.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- CABEÇALHO -->
    <!-- ========================= -->

    <header class="topo">

        <h1>

            <i class='bx bx-check-circle'></i>

            Confirmação

        </h1>

    </header>


    <main class="container">

        <!-- ========================= -->
        <!-- SUCESSO -->
        <!-- ========================= -->

        <section class="card sucesso">

            <div class="icone-sucesso">

                <i class='bx bxs-check-circle'></i>

            </div>

            <h2>

                Pagamento Confirmado!

            </h2>

            <p>

                Obrigado pela sua compra.

            </p>

            <p>

                Recebemos a confirmação do seu pagamento.

            </p>

            <p>

                Agora basta enviar o pedido para nossa equipe.

            </p>

        </section>


        <!-- ========================= -->
        <!-- RESUMO -->
        <!-- ========================= -->

        <section class="card">

            <h2>

                <i class='bx bx-receipt'></i>

                Resumo do Pedido

            </h2>

            <div class="linha">

                <span>Total</span>

                <strong id="valor-total">

                    R$ 0,00

                </strong>

            </div>

            <div class="linha">

                <span>Pagamento</span>

                <strong id="forma-pagamento">

                    PIX

                </strong>

            </div>

        </section>


        <!-- ========================= -->
        <!-- BOTÃO -->
        <!-- ========================= -->

        <section class="card">

            <button id="btn-enviar">

                <i class='bx bxl-whatsapp'></i>

                Enviar Pedido para WhatsApp

            </button>

        </section>


        <!-- ========================= -->
        <!-- RODAPÉ -->
        <!-- ========================= -->

        <section class="card agradecimento">

            <h3>

                Obrigado pela preferência!

            </h3>

            <p>

                Esperamos você novamente.

            </p>

            <strong>

                AMAKHA PARIS

            </strong>

        </section>

    </main>


    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->

    <script src="../js/config.js"></script>

    <script src="../js/modules/utils.js"></script>

    <script src="../js/modules/armazenamento.js"></script>

    <script src="../js/modules/pedido.js"></script>

    <script src="../js/modules/mensagem.js"></script>

    <script src="../js/confirmacao.js"></script>

</body>

</html>
