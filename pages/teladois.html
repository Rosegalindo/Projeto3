<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amakha Paris - Produtos</title>

<!-- GOOGLE FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    font-family:'Poppins', sans-serif;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* FUNDO */
.hero{
    width:100%;
    height:100vh;
    background-image:url("../img/fundo/Tela_grande.png");
    background-size:cover;
    background-position:center 190%;
    background-repeat:no-repeat;
}

/* CONTAINER */
.container{
    text-align:center;
}

/* BOTÕES */
.btn{
    display:block;
    width:250px;
    margin:10px auto;
    padding:18px;
    background:#d4af37;
    color:#000;
    text-decoration:none;
    font-weight:600;
    border-radius:30px;
    font-size:18px;
    transition:0.3s;

    text-align:center; /* 👈 CENTRALIZA */
}

.botoes {
    margin-top: 480px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.btn:hover{
    background:#fff;
}

/* RODAPÉ */
footer{
    position: absolute;
    bottom:10px;
    left:49.9%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:12px;
    color:#fff;
}

footer a{
    color:#ffd700;
    text-decoration:none;
}

/* MOBILE AJUSTE */
@media (max-width:768px){

    .hero{
        background-image:url("../img/fundo/Tela_menor.png");
        background-size:cover;
        background-position:center -10%;
        background-repeat:no-repeat;

        width:100%;
        height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;
    }

    .botoes{
        margin-top:280px;
        width:100%;

        display:flex;
        flex-direction:column;
        align-items:center;
        gap: 15px;
    }

    .btn{
        width:220px;
        margin: 1px auto;
        padding:18px;
        font-size:16px;
        border-radius:30px;
    }

     footer{
        position:absolute;
        bottom:10px;
        left:0;
        transform:none; /* 👈 remove centralização quebrada */
        width:100%;
        text-align:center;
        font-size:14px;
    }
}
</style>
</head>

<body>
    <section class="hero">


<div class="botoes">
    <!-- BOTÕES -->
    <a href="../pages/feminino.html" class="btn">FEMININO</a>
    <a href="../pages/masculino.html" class="btn">MASCULINO</a>
</div>

<footer>
        Criado por Solver Tecnologia - 
        <a href="https://www.instagram.com/solver.design/" target="_blank">
            Mais informações clique aqui: @solverTecnologia
        </a>
</footer>

</section>

</body>
</html>
