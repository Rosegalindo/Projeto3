<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Solver Store</title>

    <link rel="stylesheet"
          href="../css/checkout.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- ====================================== -->
    <!-- CABEÇALHO -->
    <!-- ====================================== -->

    <header class="topo-checkout">

        <h1>

            <i class='bx bx-cart'></i>

            Finalizar Pedido

        </h1>

    </header>


    <!-- ====================================== -->
    <!-- CONTAINER -->
    <!-- ====================================== -->

    <main class="checkout-container">


        <!-- ====================================== -->
        <!-- COLUNA ESQUERDA -->
        <!-- ====================================== -->

        <section class="checkout-esquerda">


            <!-- ====================================== -->
            <!-- DADOS DO CLIENTE -->
            <!-- ====================================== -->

            <div class="card">

                <h2>

                    <i class='bx bx-user'></i>

                    Dados do Cliente

                </h2>

                <div class="grupo-input">

                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome Completo">

                </div>

                <div class="grupo-input">

                    <input
                        type="tel"
                        id="telefone"
                        placeholder="WhatsApp">

                </div>

            </div>


            <!-- ====================================== -->
            <!-- ENTREGA -->
            <!-- ====================================== -->

            <div class="card">

                <h2>

                    <i class='bx bx-map'></i>

                    Entrega

                </h2>

                <div class="opcoes-radio">

                    <label>

                        <input
                            type="radio"
                            name="entrega"
                            value="retirada"
                            checked>

                        Retirar no Local

                    </label>

                    <label>

                        <input
                            type="radio"
                            name="entrega"
                            value="entrega">

                        Entrega em Domicílio

                    </label>

                </div>


                <div id="endereco"
                     class="endereco"
                     style="display:none;">

                    <input
                        type="text"
                        id="cep"
                        placeholder="CEP">

                    <input
                        type="text"
                        id="estado"
                        placeholder="Estado">

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Cidade">

                    <input
                        type="text"
                        id="bairro"
                        placeholder="Bairro">

                    <input
                        type="text"
                        id="rua"
                        placeholder="Rua">

                    <input
                        type="text"
                        id="numero"
                        placeholder="Número">

                    <input
                        type="text"
                        id="complemento"
                        placeholder="Complemento">

                    <input
                        type="text"
                        id="referencia"
                        placeholder="Ponto de Referência">

                </div>

            </div>


        </section>


        <!-- ====================================== -->
        <!-- COLUNA DIREITA -->
        <!-- ====================================== -->

        <aside class="checkout-direita">

            <div class="card">

                <h2>

                    <i class='bx bx-cart'></i>

                    Resumo do Pedido

                </h2>


                <!-- Lista de Produtos -->

                <div id="lista-checkout">

                    <!-- Produtos adicionados pelo JavaScript -->

                </div>


                <!-- Subtotal -->

                <div class="linha-total">

                    <span>Subtotal</span>

                    <strong id="subtotal">

                        R$ 0,00

                    </strong>

                </div>


                <!-- Frete -->

                <div class="linha-total">

                    <span>Frete</span>

                    <strong id="frete">

                        R$ 0,00

                    </strong>

                </div>


                <!-- Total -->

                <div class="linha-total total-geral">

                    <span>Total</span>

                    <strong id="total">

                        R$ 0,00

                    </strong>

                </div>


                <!-- ====================================== -->
                <!-- FINALIZAR PEDIDO -->
                <!-- ====================================== -->

                <button
                    id="btn-finalizar"
                    class="btn-finalizar">

                    <i class='bx bx-lock-alt'></i>

                    Finalizar Pedido

                </button>

            </div>

        </aside>


    </main>


    <!-- ====================================== -->
    <!-- JAVASCRIPT -->
    <!-- ====================================== -->

    <script src="../js/config.js"></script>

    <script src="../js/modules/utils.js"></script>

    <script src="../js/modules/armazenamento.js"></script>

    <script src="../js/modules/pedido.js"></script>

    <script src="../js/modules/mensagem.js"></script>

    <script src="../js/produtos.js"></script>

    <script src="../js/frete.js"></script>

    <script src="../js/checkout.js"></script>


</body>

</html>
