<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pagamento | Solver Store</title>

    <link rel="stylesheet"
          href="../css/pagamento.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
          rel="stylesheet">

</head>

<body>

<header>

    <h1>

        <i class='bx bx-credit-card'></i>

        Pagamento

    </h1>

</header>


<main class="container">

    <!-- ========================= -->
    <!-- RESUMO DO PEDIDO -->
    <!-- ========================= -->

    <section class="card">

        <h2>

            <i class='bx bx-receipt'></i>

            Resumo do Pedido

        </h2>


        <div class="linha-total">

            <span>Total</span>

            <strong id="valor-total">

                R$ 0,00

            </strong>

        </div>


        <div class="linha-pedido">

            <span>Pedido</span>

            <strong id="numero-pedido">

                -

            </strong>

        </div>

    </section>


    <!-- ========================= -->
    <!-- PAGAMENTO MERCADO PAGO -->
    <!-- ========================= -->

    <section class="card pagamento-card">

        <div class="icone-pagamento">

            <i class='bx bx-wallet'></i>

        </div>


        <h2>

            Pagamento seguro

        </h2>


        <p>

            Você será direcionado ao Mercado Pago

            para escolher a forma de pagamento.

        </p>


        <p class="metodos">

            <i class='bx bx-credit-card'></i>

            Cartão de Crédito

            <span>•</span>

            <i class='bx bx-qr'></i>

            PIX

        </p>


        <button
            type="button"
            id="btn-pagar"
            class="btn-pagar">

            <i class="bx bx-lock-alt"></i>

            Pagar com Mercado Pago

        </button>


        <p class="seguranca">

            <i class='bx bx-shield-quarter'></i>

            Pagamento processado com segurança pelo Mercado Pago.

        </p>

    </section>


    <!-- ========================= -->
    <!-- STATUS -->
    <!-- ========================= -->

    <section
        class="card"
        id="status-area"
        style="display:none;">

        <div id="status-mensagem"></div>

    </section>

</main>


<script src="../js/config.js"></script>

<script src="../js/modules/utils.js"></script>

<script src="../js/modules/armazenamento.js"></script>

<script src="../js/modules/pedido.js"></script>

<script src="../js/modules/mensagem.js"></script>

<script src="../js/pagamento.js"></script>


</body>

</html>
